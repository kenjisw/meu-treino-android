/* Meu Treino — aplicativo offline, sem anúncios, login ou envio de dados. */
const $=id=>document.getElementById(id);
let storage={};try{storage=JSON.parse(localStorage.getItem('meutreino_data')||'{}')||{}}catch(e){storage={}};
delete storage.fields;
const state={profile:storage.profile||'f',week:Math.max(1,Math.min(8,Number(storage.week)||1)),tab:'home',session:null,opened:null,timer:0,interval:null};
function save(){storage.profile=state.profile;storage.week=state.week;try{localStorage.setItem('meutreino_data',JSON.stringify(storage))}catch(e){}}
function profile(){return state.profile==='m'?MALE:FEMALE}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sessions(){let p=profile();if(p.key==='m')return p.workouts.map((w,i)=>({key:['SEG','TER','QUA','QUI','SEX'][i]+'_'+w.id,day:['Seg','Ter','Qua','Qui','Sex'][i],title:w.title,workout:w}));let pattern=state.week%2?['FA','FB','FA']:['FB','FA','FB'];return pattern.map((id,i)=>({key:['SEG','QUA','SEX'][i]+'_'+id,day:['Seg','Qua','Sex'][i],title:id==='FA'?'Treino A':'Treino B',workout:p.workouts.find(w=>w.id===id)}))}
function sessKey(s){return `${state.profile}_${state.week}_${s.key}`}
function exKey(s,index){return sessKey(s)+'_ex_'+index}
function sessionDone(s){return !!(storage.sessions||{})[sessKey(s)]}
function doneEx(s,i){return !!(storage.checked||{})[exKey(s,i)]}
function countedExercises(){const arr=sessions();return arr.reduce((n,s)=>n+s.workout.items.length,0)}
function doneExercises(){return sessions().reduce((n,s)=>n+s.workout.items.reduce((k,_,i)=>k+(doneEx(s,i)?1:0),0),0)}
function btn(txt,action,cls='',attrs=''){return `<button class="btn ${cls}" data-action="${action}" ${attrs}>${txt}</button>`}
function header(){return `<header class="top"><div class="brand"><div class="logo">↗</div><div><div class="eyebrow">Sua evolução</div><div class="brandtitle">MEU TREINO</div></div></div><button class="profile-tag" data-action="switch" aria-label="Trocar perfil">⇄ Trocar perfil</button></header>`}
function home(){let p=profile(),arr=sessions(),done=arr.filter(sessionDone).length;return `<div class="hero"><div class="pill">✦ Plano de 8 semanas</div><h1>${p.key==='f'?'Treinar bem é evoluir com constância.':'Treine com foco. Cresça com consistência.'}</h1><p class="tagline">${p.summary}. Siga o treino do dia, consulte as instruções e marque os exercícios feitos.</p><div class="flex" style="margin-top:18px;gap:8px;flex-wrap:wrap">${btn('Ver meu treino →','tab','', 'data-value="workouts"')}${btn('Orientações','tab','sub','data-value="guide"')}</div></div><div class="section-head"><h2>Escolher perfil</h2><span class="muted tiny">Selecione o plano</span></div><div class="grid"><button class="choose ${p.key==='f'?'selected':''}" data-action="profile" data-value="f"><div class="person">♀</div><strong>Feminino</strong><span>3 dias de musculação e 2 dias de cardio leve</span></button><button class="choose ${p.key==='m'?'selected':''}" data-action="profile" data-value="m"><div class="person">♂</div><strong>Masculino</strong><span>5 dias de musculação focada em hipertrofia</span></button></div><section class="section"><div class="section-head"><h2>${p.label}</h2><span class="pill">Semana ${state.week} de 8</span></div><div class="summary">${p.stats.map((v,i)=>`<div class="stat"><b style="font-size:17px">${v}</b><span>${['Idade','Peso','Altura'][i]}</span></div>`).join('')}</div><div class="card" style="margin-top:11px"><div class="between"><div><div class="muted tiny">Sessões finalizadas na semana</div><h3 style="margin:2px 0 7px">${done} de ${arr.length} treinos</h3></div><span class="pill">${Math.round(100*done/arr.length)}%</span></div><div class="progressbar"><div style="width:${100*done/arr.length}%"></div></div></div></section><section class="section"><div class="section-head"><h2>Calendário semanal</h2>${btn('Abrir treinos','tab','ghost','data-value="workouts"')}</div>${p.days.map((d,i)=>{const sess=arr.find(x=>x.day.toUpperCase()===({SEG:'SEG',TER:'TER',QUA:'QUA',QUI:'QUI',SEX:'SEX'}[d[0]]||''));let title=d[1],sub=d[2];if(p.key==='f'&&sess){title=sess.title;sub=sess.workout.subtitle}return `<div class="weekday"><span class="day">${d[0]}</span><div class="info"><b>${title}</b><small>${sub}</small></div>${sess?`<span class="chip ${sessionDone(sess)?'done':''}">${sessionDone(sess)?'✓ Feito':'Treinar'}</span>`:''}</div>`}).join('')}</section><section class="section"><div class="note">${p.key==='f'?'<b>Atenção ao Mounjaro:</b> evitar treinar com tontura, enjoo forte, vômitos ou ingestão insuficiente. Priorizar hidratação, alimentação e avaliação médica. Abdominais não eliminam gordura exclusivamente na barriga.':'<b>Foco em hipertrofia:</b> treino consistente, alimentação suficiente e recuperação. O programa não inclui cardio obrigatório ou circuitos de emagrecimento.'}</div></section>`}
function workouts(){let ss=sessions();if(!ss.some(s=>s.key===state.session))state.session=ss[0].key;let sess=ss.find(s=>s.key===state.session)||ss[0],n=sess.workout.items.length,completed=sess.workout.items.filter((_,i)=>doneEx(sess,i)).length;return `<section class="section"><div class="eyebrow">Ficha de exercícios</div><h1 style="margin:8px 0 7px">Treinos da semana ${state.week}</h1><div class="muted small">Selecione o dia e toque em um exercício para ver a execução passo a passo.</div></section><div class="workout-pills">${ss.map(s=>`<button data-action="session" data-value="${s.key}" class="${state.session===s.key?'active':''}">${s.day} · ${s.title.replace('Treino ','')}</button>`).join('')}</div><div class="card alt"><div class="between"><div><div class="eyebrow">${sess.day} · ${sess.title}</div><h2 style="margin-top:5px">${sess.workout.subtitle}</h2></div><span class="pill">${completed}/${n}</span></div><p class="muted small">${n} exercícios · descanso de 60–90 s (até 2–3 min em exercícios pesados)</p><div class="progressbar"><div style="width:${Math.round(completed*100/n)}%"></div></div></div><div class="timer"><div><div class="tiny muted">Cronômetro de descanso</div><b id="timer-number">${mmss(state.timer)}</b></div><div class="flex"><button data-action="timer" data-value="60">1 min</button><button data-action="timer" data-value="90">1:30</button><button data-action="timer-stop">Parar</button></div></div><div class="section-head" style="margin-top:21px"><h2>Exercícios</h2><span class="tiny muted">Toque para abrir ▾</span></div>${sess.workout.items.map(([id,prescription],i)=>exercise(sess,id,prescription,i)).join('')}<div class="card" style="margin-top:17px"><h3>Conclusão da sessão</h3><p class="muted small">Se quiser, marque os exercícios concluídos e finalize o treino do dia. Sem anotar cargas.</p>${btn(sessionDone(sess)?'✓ Sessão concluída · desfazer':'✓ Finalizar treino','finish',sessionDone(sess)?'sub':'',`data-value="${esc(sess.key)}"`)}</div>`}
function exercise(s,id,r,i){const e=EX[id],key=exKey(s,i),opened=state.opened===key;return `<article class="exercise"><div class="ex-main"><span class="num">${String(i+1).padStart(2,'0')}</span><div class="ex-info" data-action="expand" data-value="${key}"><b>${e.name} ${opened?'⌃':'⌄'}</b><small>${r} · ${e.muscle}</small></div><button class="check ${doneEx(s,i)?'checked':''}" data-action="check" data-value="${key}" aria-label="${doneEx(s,i)?'Desmarcar':'Marcar'} exercício">${doneEx(s,i)?'✓':''}</button></div>${opened?`<div class="ex-expand"><div class="label">1 · Prepare a posição</div><p>${e.setup}</p><div class="label">2 · Faça o movimento</div><p>${e.move}</p><div class="label">3 · Erro a evitar</div><p>${e.avoid}</p><div class="callout" style="margin-top:14px">Faça as séries e repetições indicadas. Para marcar como feito, toque no quadrado ao lado do exercício.</div><div class="callout">Se sentir dor aguda, tontura ou perda de técnica, interrompa e peça orientação ao professor.</div></div>`:''}</article>`}
function progress(){let p=profile(),ss=sessions(),total=ss.length,done=ss.filter(sessionDone).length,ex=doneExercises(),max=countedExercises();return `<section class="section"><div class="eyebrow">Semana de treino</div><h1>Treinos concluídos</h1><p class="muted small">Consulte a programação e veja quais exercícios você já concluiu, sem anotações de cargas.</p></section><div class="card"><div class="between"><div><h2>Semana ${state.week} de 8</h2><p class="muted tiny">Mude a semana para acompanhar a evolução</p></div><div class="stepper"><button data-action="week" data-value="-1">−</button><b>${state.week}</b><button data-action="week" data-value="1">+</button></div></div><div class="progressbar" style="margin-top:12px"><div style="width:${100*done/total}%"></div></div></div><section class="section"><div class="grid"><div class="stat"><b>${done}/${total}</b><span>Sessões concluídas</span></div><div class="stat"><b>${ex}/${max}</b><span>Exercícios marcados</span></div></div><div class="card" style="margin-top:10px"><h3>Treinos previstos</h3>${ss.map(s=>`<div class="weekday"><span class="day">${s.day}</span><div class="info"><b>${s.title} · ${s.workout.subtitle}</b><small>${s.workout.items.filter((_,i)=>doneEx(s,i)).length} de ${s.workout.items.length} exercícios</small></div><span class="chip ${sessionDone(s)?'done':''}">${sessionDone(s)?'Concluído':'Pendente'}</span></div>`).join('')}</div></section><section class="section"><div class="card"><h3>Treine no seu ritmo</h3><p class="small muted">Use as séries e repetições recomendadas como guia e priorize a execução correta. O professor da academia pode ajudar a escolher e ajustar as cargas, sem precisar anotá-las no aplicativo.</p>${btn('Ir para os treinos','tab','','data-value="workouts"')}</div></section>`}
function guide(){let male=state.profile==='m';let data=male?[
['Aquecimento','Comece com 5–8 minutos de atividade leve e faça 1–3 séries de aquecimento progressivo antes dos principais exercícios, sem contar essas séries como trabalho.'],
['Séries e esforço','As séries da ficha são a meta do programa, não uma obrigação desde o primeiro dia. Se ele for iniciante ou estiver destreinado, use cerca de 1–2 séries por exercício nas semanas 1–2; progrida conforme tolerância.'],
['Descansos','Descanse 2–3 minutos nos movimentos compostos (supinos, agachamentos, remadas pesadas) e 60–120 segundos nos isolados.'],
['Progressão','Complete a faixa de repetições mantendo técnica; só depois aumente a carga. Mantenha 1–3 repetições de reserva na maioria das séries.'],
['Recuperação e alimentação','Priorize sono suficiente, ingestão de proteína adequada e calorias suficientes para sustentar hipertrofia. Um nutricionista pode individualizar a meta.'],
['Quando reduzir o treino','Se dores musculares impedirem os movimentos ou o desempenho despencar por vários dias, diminua séries ou cargas e busque orientação.']]:[
['Aquecimento','Faça 5–8 minutos de caminhada ou bicicleta leve e uma série leve antes do primeiro exercício.'],
['Semanas 1–2','Faça 1 série nas sessões iniciais, progredindo para 2 se tolerar. Conserve aproximadamente 3–4 repetições de reserva.'],
['Semanas 3–4','Pratique 2 séries por exercício e concentre-se em movimentos sem dor, controle e estabilidade.'],
['Semanas 5–6','Caso a recuperação esteja adequada, passe a 2–3 séries nos exercícios principais, mantendo 2–3 repetições de reserva.'],
['Semanas 7–8','Aumente cargas somente após realizar as repetições prescritas com boa técnica. Treinar até a falha não é necessário.'],
['Cardio','Terça e quinta: 20–30 minutos de esteira, elíptico ou bicicleta em intensidade confortável. Aumente gradualmente.'],
['Mounjaro','O medicamento pode reduzir o apetite e causar náusea. Evite treinar se estiver com tontura, vômitos, fraqueza importante ou sem conseguir se alimentar/hidratar. Consulte o médico sobre o tratamento e o nutricionista para preservar massa muscular.'],
['Gordura abdominal','Abdominais fortalecem a região, mas não queimam gordura localizada. A evolução depende da composição corporal ao longo do tempo.']];return `<section class="section"><div class="eyebrow">Manual do treino</div><h1>Orientações e segurança</h1><p class="muted small">Recomendações simples para treinar na academia com mais confiança.</p></section><div class="card">${data.map(([title,detail])=>`<div class="instruction"><b>${title}</b><span>${detail}</span></div>`).join('')}</div><section class="section"><div class="note"><b>Importante:</b> este aplicativo é um guia educacional e não substitui avaliação individual de médico, nutricionista ou profissional de educação física. Máquinas diferentes exigem ajustes próprios. Em caso de dor articular, problemas cardíacos ou limitações clínicas, procure avaliação antes de iniciar.</div></section>`}
function mmss(sec){return `${Math.floor(sec/60).toString().padStart(2,'0')}:${(sec%60).toString().padStart(2,'0')}`}
function navbar(){let tabs=[['home','⌂','Início'],['workouts','▤','Treinos'],['progress','✓','Concluídos'],['guide','ⓘ','Guia']];$('nav').innerHTML=tabs.map(([id,icon,title])=>`<button data-action="tab" data-value="${id}" class="${state.tab===id?'active':''}"><i>${icon}</i><span>${title}</span></button>`).join('')}
function render(){let view=state.tab==='home'?home():state.tab==='workouts'?workouts():state.tab==='progress'?progress():guide();$('app').innerHTML=header()+view;navbar()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,v=el.dataset.value;if(a==='tab'){state.tab=v;state.opened=null;window.scrollTo(0,0)}else if(a==='switch'){state.tab='home';window.scrollTo(0,0)}else if(a==='profile'){state.profile=v;state.session=null;state.opened=null;save()}else if(a==='session'){state.session=v;state.opened=null;window.scrollTo(0,60)}else if(a==='expand'){state.opened=state.opened===v?null:v}else if(a==='check'){storage.checked=storage.checked||{};storage.checked[v]=!storage.checked[v];save()}else if(a==='finish'){let s=sessions().find(s=>s.key===v);if(s){storage.sessions=storage.sessions||{};storage.sessions[sessKey(s)]=!storage.sessions[sessKey(s)];save()}}else if(a==='week'){state.week=Math.max(1,Math.min(8,state.week+Number(v)));state.session=null;state.opened=null;save()}else if(a==='timer'){state.timer=Number(v);clearInterval(state.interval);state.interval=setInterval(()=>{if(state.timer>0){state.timer--;let x=$('timer-number');if(x)x.textContent=mmss(state.timer)}if(state.timer===0)clearInterval(state.interval)},1000)}else if(a==='timer-stop'){clearInterval(state.interval);state.timer=0}render()});
render();

</script></body></html>
