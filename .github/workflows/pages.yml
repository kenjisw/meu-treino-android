name: Publicar Meu Treino Web

on:
  push:
    branches: [main]
    paths:
      - 'assets/index.html'
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v6
      - name: Criar site instalavel
        shell: bash
        run: |
          mkdir -p _site/icons
          cp assets/index.html _site/index.html
          cp web/manifest.webmanifest web/sw.js _site/
          cp web/icons/icon.svg _site/icons/
          touch _site/.nojekyll
          python3 - <<'PY'
          from pathlib import Path
          p = Path('_site/index.html')
          html = p.read_text(encoding='utf-8')
          assert '</head>' in html and '</body>' in html
          headers = """
          <link rel="manifest" href="./manifest.webmanifest">
          <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
          <link rel="apple-touch-icon" href="./icons/icon.svg">
          <meta name="apple-mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
          <meta name="apple-mobile-web-app-title" content="Meu Treino">
          """
          startup = """
          <script>
          if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
              navigator.serviceWorker.register('./sw.js').catch(function(error) {
                console.warn('Offline indisponível:', error);
              });
            });
          }
          </script>
          """
          html = html.replace('</head>', headers + '</head>', 1)
          html = html.replace('</body>', startup + '</body>', 1)
          p.write_text(html, encoding='utf-8')
          PY
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Publicar arquivos estaticos
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Disponibilizar site
        id: deployment
        uses: actions/deploy-pages@v4
